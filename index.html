  <!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EventMini — Inscrições</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="container">
    <h1>EventMini</h1>
    <p class="subtitle">Cadastro de participantes e cálculo de inscrições</p>

    <form id="inscricao-form" class="card">
      <div class="field">
        <label for="nome">Nome completo</label>
        <input type="text" id="nome" required placeholder="Ex.: Ana Souza" />
      </div>

      <div class="field">
        <label for="idade">Idade</label>
        <input type="number" id="idade" required placeholder="Ex.: 20" />
      </div>

      <div class="field checkbox-field">
        <input type="checkbox" id="estudante" />
        <label for="estudante">Estudante (20% de desconto)</label>
      </div>

      <button type="submit">Adicionar inscrição</button>
      <p id="mensagem" class="mensagem" aria-live="polite"></p>
    </form>

    <section class="card resumo">
      <div>
        <span>Inscritos:</span>
        <strong id="total-inscritos">0</strong>
      </div>
      <div>
        <span>Total arrecadado:</span>
        <strong id="total-arrecadado">R$ 0,00</strong>
      </div>
    </section>

    <section class="card">
      <h2>Participantes confirmados</h2>
      <ul id="lista-inscritos" class="lista"></ul>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
